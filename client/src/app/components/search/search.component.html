<h1>Search Spotify</h1>

<!-- Bind input to searchString -->
<input [(ngModel)]="searchString">

<!-- Bind dropdown to searchCategory -->
<select [(ngModel)]="searchCategory">
  <option *ngFor="let category of searchCategories" [value]="category">
    {{category}}
  </option>
</select>

<!-- Call search when button is clicked -->
<button class="btn btn-light" (click)="search()">Search</button>

<!-- Display carousel for artists and albums -->
<app-carousel
  *ngIf="searchCategory === 'artist' || searchCategory === 'album'"
  [resources]="resources"
  carouselId="searchCarousel">
</app-carousel>

<!-- Display track list for tracks -->
<app-track-list
  *ngIf="searchCategory === 'track'"
  [tracks]="$any(resources)">
</app-track-list>
